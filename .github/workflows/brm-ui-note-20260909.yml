name: BRM surgical source note
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brm-ui-note-20260909.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert exact source-total note
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="metric"><span>Copernicus EMS · contexto</span><b id="cemsCount" class="green">—</b></div></article><article class="card ops-card"><h3>FRESCURA</h3>'
          new='<div class="metric"><span>Copernicus EMS · contexto</span><b id="cemsCount" class="green">—</b></div><div class="map-note" style="margin-top:10px">TOTAL MAPA = USGS + GDACS + METEO ES + METEO EU · CEMS aporta contexto y no suma al total.</div></article><article class="card ops-card"><h3>FRESCURA</h3>'
          if s.count(old)!=1: raise SystemExit('Expected exactly one CEMS/FRESCURA boundary')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name 'BRM Surgical Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/brm-ui-note-20260909.yml
          git add public/index.html
          git diff --cached --check
          git commit -m 'fix: clarify CEMS context in source totals'
          git push
