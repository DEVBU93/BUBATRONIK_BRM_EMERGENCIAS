name: BRM theme and help surgical fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brm-ui-theme-fix-20260909.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact surgical replacements
        shell: python
        run: |
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          reps=[
            ('<a class="ping-button secondary" href="/ayuda.html">AYUDA POR NECESIDAD</a>',''),
            ('<div class="status" id="systemStatus">● INICIANDO FUENTES…</div></header>','<div class="status" id="systemStatus">● INICIANDO FUENTES…</div><button class="icon-btn brm-index-theme" type="button" data-theme-toggle aria-label="Cambiar a modo claro" title="Cambiar tema">☀</button></header>'),
          ]
          for old,new in reps:
            if s.count(old)!=1: raise SystemExit(f'Missing exact target: {old!r}')
            s=s.replace(old,new,1)
          old='''<button class="brm-theme-toggle" id="brmThemeToggle" type="button" aria-label="Cambiar tema"></button><script>(()=>{const b=document.body,k="brm-theme",saved=localStorage.getItem(k);if(saved==="light")b.classList.add("brm-light");if(saved==="dark")b.classList.add("brm-dark");const btn=document.getElementById("brmThemeToggle"),sync=()=>{const light=b.classList.contains("brm-light");btn.textContent=light?"☾ OSCURO":"☀ CLARO";btn.setAttribute("aria-pressed",light?"true":"false")};btn.onclick=()=>{const light=!b.classList.contains("brm-light");b.classList.toggle("brm-light",light);b.classList.toggle("brm-dark",!light);localStorage.setItem(k,light?"light":"dark");sync()};sync()})();</script>'''
          new='''<script>(function(){const t=document.querySelector('[data-theme-toggle]'),root=document.documentElement;let theme=matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';function set(){root.dataset.theme=theme;t.textContent=theme==='dark'?'☀':'☾';t.setAttribute('aria-label',`Cambiar a modo ${theme==='dark'?'claro':'oscuro'}`);t.setAttribute('title','Cambiar tema')}set();t.addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';set()})})();</script>'''
          if s.count(old)!=1: raise SystemExit('Missing existing BRM theme toggle block')
          s=s.replace(old,new,1)
          marker='</style>'
          css='''html[data-theme="light"] body{background:#f4f1e9!important;color:#17181b!important}html[data-theme="light"] .head,html[data-theme="light"] .hero,html[data-theme="light"] .section,html[data-theme="light"] .card,html[data-theme="light"] .source-card,html[data-theme="light"] .incident-side,html[data-theme="light"] .context,html[data-theme="light"] .ping-door{background:#fffdf8!important;color:#17181b!important;border-color:#d7dbe1!important}html[data-theme="light"] .nav{background:#f0ece2!important;border-color:#d7dbe1!important}html[data-theme="light"] .nav a{color:#4a515b;border-color:#c4cad2}html[data-theme="light"] .nav a.primary{color:#111}html[data-theme="light"] .lead,html[data-theme="light"] .ping-door p,html[data-theme="light"] .ping-door li,html[data-theme="light"] .context-copy,html[data-theme="light"] .context-card span,html[data-theme="light"] .event small,html[data-theme="light"] .muted,html[data-theme="light"] .title span,html[data-theme="light"] .badge,html[data-theme="light"] .map-note,html[data-theme="light"] .footer,html[data-theme="light"] .notice{color:#5d6570!important}html[data-theme="light"] .card h3,html[data-theme="light"] .title h2,html[data-theme="light"] .context h3,html[data-theme="light"] .source-card b,html[data-theme="light"] .event b,html[data-theme="light"] .context-card b{color:#17181b}html[data-theme="light"] .filter,html[data-theme="light"] .map-view{background:#fff!important;color:#3d4652!important;border-color:#c4cad2!important}html[data-theme="light"] .filter.active,html[data-theme="light"] .filter:hover,html[data-theme="light"] .map-view.active,html[data-theme="light"] .map-view:hover{background:#f5c518!important;color:#111!important;border-color:#f5c518!important}html[data-theme="light"] .context-card{background:#f8f9fa!important;border-color:#d7dbe1!important}html[data-theme="light"] .leaflet-popup-content-wrapper,html[data-theme="light"] .leaflet-popup-tip{background:#fff!important;color:#17181b!important}html[data-theme="light"] .leaflet-popup-content{color:#17181b!important}html[data-theme="light"] .leaflet-control-zoom a{background:#fff!important;color:#6a5200!important;border-color:#d7dbe1!important}.brm-index-theme{min-width:44px;min-height:44px;border:1px solid #303044;background:#101016;color:#eee;cursor:pointer;font:700 18px "JetBrains Mono";line-height:1}.brm-index-theme:hover{border-color:#f5c518;color:#f5c518}html[data-theme="light"] .brm-index-theme{background:#fff;color:#3d4652;border-color:#c4cad2}html[data-theme="light"] .brm-index-theme:hover{background:#f5c518;color:#111;border-color:#f5c518}'''
          if s.count(marker)!=1: raise SystemExit('Expected one style close')
          s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate and commit
        run: |
          git diff --check
          git diff -- public/index.html | sed -n '1,180p'
          git config user.name 'BRM Surgical Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/brm-ui-theme-fix-20260909.yml
          git add public/index.html
          git diff --cached --check
          git commit -m 'fix: align emergency theme toggle and remove duplicate help'
          git push
